name: Desplegar funciones de Supabase

# Se ejecuta a mano desde la pestaña Actions. Sube las 3 funciones `fin-*` y sus secretos
# al proyecto de Supabase. NO modifica la base de datos ni las funciones de otras apps.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Acepta el token con cualquiera de los dos nombres
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.FINANZAS_GITHUB }}
      # El identificador del proyecto no es secreto; se puede sobrescribir con el secreto SUPABASE_PROJECT_REF
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'bwdkfahrgvqfqxryjfll' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Guardar secretos (con prefijo FIN_)
        env:
          FIN_ANTHROPIC_API_KEY: ${{ secrets.FIN_ANTHROPIC_API_KEY }}
          FIN_CRON_SECRET: ${{ secrets.FIN_CRON_SECRET }}
          BELVO_SECRET_ID: ${{ secrets.BELVO_SECRET_ID }}
          BELVO_SECRET_PASSWORD: ${{ secrets.BELVO_SECRET_PASSWORD }}
          BELVO_ENV: ${{ secrets.BELVO_ENV }}
        run: |
          args=("FIN_ANTHROPIC_API_KEY=$FIN_ANTHROPIC_API_KEY" "FIN_CRON_SECRET=$FIN_CRON_SECRET")
          if [ -n "$BELVO_SECRET_ID" ] && [ -n "$BELVO_SECRET_PASSWORD" ]; then
            args+=("BELVO_SECRET_ID=$BELVO_SECRET_ID" "BELVO_SECRET_PASSWORD=$BELVO_SECRET_PASSWORD" "BELVO_ENV=${BELVO_ENV:-sandbox}")
          fi
          supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"
      - name: Desplegar fin-assistant
        run: supabase functions deploy fin-assistant --project-ref "$PROJECT_REF"
      - name: Desplegar fin-belvo
        run: supabase functions deploy fin-belvo --project-ref "$PROJECT_REF"
      - name: Desplegar fin-scheduler (sin JWT; protegida con x-cron-secret)
        run: supabase functions deploy fin-scheduler --no-verify-jwt --project-ref "$PROJECT_REF"
