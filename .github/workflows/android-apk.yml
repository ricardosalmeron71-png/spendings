name: Compilar APK Android

on:
  workflow_dispatch: # se ejecuta a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - name: Inyectar llaves públicas de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bwdkfahrgvqfqxryjfll.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          jq --arg u "$SUPABASE_URL" --arg k "$SUPABASE_ANON_KEY" \
            '.build.preview.env = {EXPO_PUBLIC_SUPABASE_URL: $u, EXPO_PUBLIC_SUPABASE_ANON_KEY: $k}' \
            eas.json > eas.tmp && mv eas.tmp eas.json
      - name: Confirmar cambios locales (EAS exige un repositorio limpio; no se sube nada)
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "CI: projectId y variables de compilación" || true
      - name: Compilar APK en la nube de Expo
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait --json > build.json
      - name: Mostrar enlace de descarga
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "### 📲 Descarga tu APK: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
